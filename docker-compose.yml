services:
  rag:
    build:
      context: .
      dockerfile: Dockerfile
    image: open-knowledge-ui
    container_name: open-knowledge-ui
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8083:5000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      # Chat-Stopp ueber Prozessgrenzen (Pub/Sub); leer = Stopp nur im eigenen Prozess
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Zugang zum Tool-Worker (fuehrt Pandas-Code isoliert aus), z. B. openssl rand -hex 32
      - TOOL_WORKER_TOKEN=${TOOL_WORKER_TOKEN:?TOOL_WORKER_TOKEN in .env setzen (z. B. openssl rand -hex 32)}
      # Schluessel fuer Zugangsdaten in der Datenbank (Fernet); leer = Schluesseldatei im Datenverzeichnis
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # OCR-Engine fuer PDFs: tesseract (default) | rapidocr | ocrmac (macOS) | off, naehere
      # Details (Sprachcodes, tesseract.exe-Pfad) siehe env.example:
      # - OCR_ENGINE=tesseract
      # - OCR_LANGUAGES=deu,eng
      # - OCR_TESSERACT_CMD=/usr/local/bin/tesseract
    volumes:
      # Alle App-Daten (uploads, archiv, images, summaries, data) liegen im
      # einzelnen app-data-Volume als Subdirs von /app/data. Fruehere Bind-
      # Mounts (./files etc.) entfallen; nur /app/data ist ein Mountpoint,
      # die Subdirs sind normale Verzeichnisse (kein EBUSY bei rmtree/move).
      - app-data:/app/data
      # ONNX-Modell-Cache (FastEmbed). Beim ersten Start werden die zur Build-Zeit
      # vorgeladenen Modelle aus dem Image ins Volume kopiert und persistieren
      # danach ueber Image-Rebuilds hinweg. Pfad seit dem Non-Root-Image:
      # /app/.cache statt /root/.cache — die alten Volumes behalten ihre Inhalte,
      # die Modelle laden einmalig neu.
      - fastembed-cache:/app/.cache/fastembed
      # HuggingFace-Cache: heruntergeladene Embedding-/Reranking-Modelle (z. B. bge-m3)
      # und die Docling-Modelle bleiben ueber Neustarts und Rebuilds erhalten.
      - hf-cache:/app/.cache/huggingface
    networks:
      - open-knowledge-ui-network
      - tool-worker-net
      - sql-worker-net
    # GPU fuer Embedding, Reranking und Docling (braucht NVIDIA Container Toolkit).
    # Ohne GPU diesen Block entfernen und mit --build-arg TORCH_BACKEND=cpu bauen;
    # die App faellt ohne GPU automatisch auf die CPU zurueck.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Fuehrt Pandas-Code isoliert aus: kein Ausgang nach aussen, Daten nur lesend, nicht als root.
  # Die App laeuft auch ohne ihn; "run_pandas" meldet dann "Codeausfuehrung nicht verfuegbar".
  # Siehe docs/tool-worker-api.md
  tool-worker:
    build:
      context: .
      dockerfile: tool_worker/Dockerfile
    image: open-knowledge-ui-tool-worker
    container_name: open-knowledge-ui-tool-worker
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 4g
    cpus: 2
    environment:
      - TOOL_WORKER_TOKEN=${TOOL_WORKER_TOKEN:?TOOL_WORKER_TOKEN in .env setzen (z. B. openssl rand -hex 32)}
      - TOOL_WORKER_DATA_DIR=/data
      - TOOL_WORKER_ROLE=pandas
    volumes:
      - app-data:/data:ro
    networks:
      - tool-worker-net

  # Fragt SQL-Datenbanken lesend ab (Knowledge "SQL-Datenbank"). Als einziger Dienst mit Ausgang zu den
  # Datenbankzielen; ohne Zugriff auf Daten, Postgres oder Qdrant der App. docs/tool-worker-api.md
  tool-worker-sql:
    build:
      context: .
      dockerfile: tool_worker/Dockerfile
    image: open-knowledge-ui-tool-worker
    container_name: open-knowledge-ui-tool-worker-sql
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TOOL_WORKER_TOKEN=${TOOL_WORKER_TOKEN:?TOOL_WORKER_TOKEN in .env setzen (z. B. openssl rand -hex 32)}
      - TOOL_WORKER_ROLE=sql
      - TOOL_WORKER_SQLITE_DIR=/sqlite
    volumes:
      # SQLite-Dateien, die als Quelle dienen duerfen (nur lesend); Ordner anlegen oder SQL_SQLITE_DIR setzen
      - ${SQL_SQLITE_DIR:-./sql-data}:/sqlite:ro
    networks:
      - sql-worker-net

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: open-knowledge-ui-searxng
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
    networks:
      - open-knowledge-ui-network

  # Referenz-Sanitizer (optional): jeder Dienst nach docs/sanitizer-api.md kann ihn ersetzen
  entityguard:
    image: ghcr.io/s2a-open-technologies/entityguard:latest-cpu 
    container_name: open-knowledge-ui-entityguard
    restart: always
    ports:
      - "8082:9500"
    volumes:
      - entityguard-data:/app/data
    networks:
      - open-knowledge-ui-network

  parakeet:
    build:
      context: ./parakeet
      args:
        DEVICE: gpu
    image: open-knowledge-ui-parakeet
    container_name: open-knowledge-ui-parakeet
    restart: unless-stopped
    environment:
      - PARAKEET_MODEL=nemo-parakeet-tdt-0.6b-v3
    networks:
      - open-knowledge-ui-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Datenbank der App (Benutzer, Chats, Einstellungen, Modelle). Zugangsdaten in .env
  # (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB); der Standardwert "rag" ist nur fuer
  # lokale Tests gedacht und sollte fuer den Betrieb geaendert werden. Der Host-Port ist nur
  # auf localhost gebunden (Import, pgAdmin, Backups); aendern oder entfernen mit POSTGRES_PORT
  # bzw. durch Streichen der "ports"-Zeilen.
  postgres:
    image: postgres:17
    container_name: open-knowledge-ui-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-rag}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rag}
      - POSTGRES_DB=${POSTGRES_DB:-rag}
      # ports:
      #  - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - open-knowledge-ui-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Chat-Stopp zwischen Worker-Prozessen (Pub/Sub, kurzlebige Schluessel); keine Daten, kein Volume.
  redis:
    image: redis:7.4-alpine
    container_name: open-knowledge-ui-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - open-knowledge-ui-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: open-knowledge-ui-qdrant
    restart: unless-stopped
    volumes:
      - qdrant:/qdrant/storage
    networks:
      - open-knowledge-ui-network
    healthcheck:
      # Das offizielle qdrant-Image enthaelt kein wget/curl, nur bash - daher
      # TCP-Connect-Check statt HTTP-Request (wget schlug bisher immer mit
      # "executable file not found" fehl und markierte den Container dauerhaft
      # als unhealthy, unabhaengig davon ob Qdrant tatsaechlich lief).
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  open-knowledge-ui-network:
    driver: bridge
  # Nur App und Tool-Worker; "internal" = kein Weg nach aussen (Compose-Ebene, siehe docs/tool-worker-api.md)
  tool-worker-net:
    driver: bridge
    internal: true
  # App und SQL-Worker; normales Bridge-Netz (mit Ausgang), damit der Worker Datenbanken erreicht
  sql-worker-net:
    driver: bridge

volumes:
  pgdata:
  qdrant:
  app-data:
  fastembed-cache:
  hf-cache:
  entityguard-data:
