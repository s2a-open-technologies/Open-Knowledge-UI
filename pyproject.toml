[project]
name = "open-knowledge-ui"
version = "0.2.5"
description = "German Flask RAG app with SSE chat, SQLAlchemy multi-user management, Qdrant hybrid search, Pandas analytics tools, and Ollama/OpenAI-compatible LLMs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Christopher Abanilla" }
]
maintainers = [
    { name = "S2A Open Technologies gGmbH" }
]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Flask",
]
dependencies = [
    "chardet>=5.2.0",
    "snowballstemmer>=2.2.0",
    "docling>=2.0.0",
    "fastembed>=0.8.0",
    "flask>=3.0.0",
    "flask-sock>=0.7.0",
    "langchain>=1.2.13",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.12",
    "langchain-qdrant>=1.1.0",
    "msoffcrypto-tool>=6.0.0",
    "openpyxl>=3.1.5",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "requests>=2.28.0",
    "qdrant-client>=1.17.1",
    "ruff>=0.15.7",
    "sentence-transformers>=5.0.0",
    "sqlalchemy>=2.0.0",
    "tqdm>=4.67.3",
    "imagehash>=4.3.1",
    "pillow>=13.0.0,<14.0.0",
    "ml-dtypes>=0.5.4",
    "tabulate>=0.10.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.13.0",
    "markdown>=3.7.0",
    "torch",
    "torchvision",
    "waitress>=3.0.2",
    "gunicorn>=25.3.0",
    "alembic>=1.18.4",
    "websocket-client>=1.8.0",
    "psycopg[binary]>=3.2",
    "ldap3>=2.9.1",
    "pyjwt[crypto]>=2.15.1",
    "cryptography>=42.0.0",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
# Nur fuer Tests des Tool-Workers (SQL-Rolle); das Worker-Image installiert sie selbst
worker = ["sqlglot>=30.24.0", "pymysql>=1.1", "pymssql>=2.3"]

# torch/torchvision auf den CPU-only-Wheel-Index pinnen (kein CUDA-Download).
# Docling nutzt torch fuer Layout-/TableFormer-Modelle; sentence-transformers
# zieht es ebenfalls. WICHTIG: torch/torchvision muessen als DIREKTE Deps
# gelistet sein, damit [tool.uv.sources] greift (bei rein transitiver
# Anforderung ignoriert uv das Source-Mapping). explicit=true beschraenkt den
# Index auf die hier gemappten Pakete; alle anderen Deps bleiben auf PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.uv]
# Pillow 13 enthaelt die Sicherheitsfixes fuer 39 CVEs (u. a. JPEG-Overflow,
# CVE-2026-96639). fastembed 0.9.0 deklariert noch pillow<13 (marker-abhaengig
# sogar >=12,<13 fuer Python >=3.14), obwohl PIL dort nur in den hier nicht
# genutzten Bild-/Multimodal-Modulen importiert wird. Der Override ersetzt alle
# Requirements auf pillow; die Obergrenze <14 entspricht docling und verhindert
# ein stilles Major-Upgrade. Entfernen, sobald fastembed pillow<14 erlaubt.
# Die Docker-Pip-Installation liest tool.uv nicht und nutzt uv-overrides.txt.
override-dependencies = ["pillow>=13.0.0,<14.0.0"]
