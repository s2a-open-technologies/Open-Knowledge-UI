# macOS: nur die Hilfsdienste laufen in Docker, die App selbst laeuft nativ
# (python run_mac.py), weil Docker auf dem Mac keinen Zugriff auf die GPU (Metal) hat.
#
#   docker compose -f docker-compose.mac.yml up -d
#
# Alle Ports sind nur auf localhost gebunden.
name: open-knowledge-ui-mac

services:
  # Datenbank der App; die native App verbindet sich ueber localhost:5432.
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-rag}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rag}
      - POSTGRES_DB=${POSTGRES_DB:-rag}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Chat-Stopp ueber Prozessgrenzen; die native App verbindet sich ueber localhost:6379.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant:/qdrant/storage

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/

  entityguard:
    image: entityguard-entityguard:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:9500"
    volumes:
      - entityguard-data:/app/data

  # Spracheingabe (CPU-Variante; die GPU-Variante braucht NVIDIA). Optional:
  # bei Bedarf entfernen, dann fehlt nur der Mic-Button.
  parakeet:
    build:
      context: ./parakeet
      args:
        DEVICE: cpu
    image: open-knowledge-ui-parakeet-cpu
    restart: unless-stopped
    environment:
      - PARAKEET_MODEL=nemo-parakeet-tdt-0.6b-v3
    ports:
      - "127.0.0.1:5001:5001"

  # Fuehrt Pandas-Code isoliert aus (run_pandas). Auf dem Mac mit Port auf localhost, weil die App nativ
  # laeuft; ein Netz ohne Ausgang laesst sich mit veroeffentlichtem Port nicht kombinieren. Der Code ist
  # trotzdem gekapselt (nicht root, Daten nur lesend, Kindprozess mit Limits, Audit-Hook).
  # run_mac.py legt TOOL_WORKER_TOKEN in der .env an und stellt die Adressen in den Einstellungen ein.
  tool-worker:
    build:
      context: .
      dockerfile: tool_worker/Dockerfile
    image: open-knowledge-ui-tool-worker
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 4g
    environment:
      - TOOL_WORKER_TOKEN=${TOOL_WORKER_TOKEN:?TOOL_WORKER_TOKEN in .env setzen (run_mac.py macht das)}
      # Schluessel fuer Zugangsdaten in der Datenbank (Fernet); leer = Schluesseldatei im Datenverzeichnis
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - TOOL_WORKER_ROLE=pandas
      - TOOL_WORKER_DATA_DIR=/data
    volumes:
      # Datenordner der nativen App (DATA_DIR, Standard ./data), nur lesend
      - ${DATA_DIR:-./data}:/data:ro
    ports:
      - "127.0.0.1:8090:8090"

  # Fragt SQL-Datenbanken lesend ab (Knowledge "SQL-Datenbank"). Datenbanken auf dem Mac erreichst du
  # ueber host.docker.internal.
  tool-worker-sql:
    build:
      context: .
      dockerfile: tool_worker/Dockerfile
    image: open-knowledge-ui-tool-worker
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TOOL_WORKER_TOKEN=${TOOL_WORKER_TOKEN:?TOOL_WORKER_TOKEN in .env setzen (run_mac.py macht das)}
      - TOOL_WORKER_ROLE=sql
      - TOOL_WORKER_SQLITE_DIR=/sqlite
    volumes:
      - ${SQL_SQLITE_DIR:-./sql-data}:/sqlite:ro
    ports:
      - "127.0.0.1:8091:8090"

volumes:
  pgdata:
  qdrant:
  entityguard-data:
