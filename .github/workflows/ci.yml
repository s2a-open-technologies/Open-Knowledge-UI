name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Abhängigkeiten installieren
        run: uv sync --frozen --extra worker --extra test

      - name: Tests
        run: uv run --extra worker --extra test --with pytest pytest tests -q

      - name: "Ruff-Gate: Basis-Regelwerk E4/E7/E9/F"
        run: uv run ruff check . --select E4,E7,E9,F
      - name: "Ruff-Statistik (nur Information, weitere Regel-Altlasten)"
        run: uv run ruff check . --exit-zero --statistics

  frontend:
    name: Frontend-Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Typecheck (tsc -b) und Produktions-Build
      - run: npm run test
      - run: npm run build
