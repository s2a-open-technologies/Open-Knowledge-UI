name: Release

# Läuft beim Push eines Version-Tags (vX.Y.Z), den `scripts/release.py bump` anlegt
# und `scripts/release.py publish --yes` pusht.
#
# Actions sind auf volle Commit-SHAs gepinnt (Tags lassen sich verschieben). Aktualisierung
# übernimmt Dependabot (.github/dependabot.yml). Schreibrechte hat nur der letzte Job,
# Tests und Build laufen ohne.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    name: Prüfen, testen, bauen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Tag muss zur Version in pyproject.toml/package.json/uv.lock passen und der
      # Changelog muss einen nicht leeren Abschnitt dafür haben.
      - name: Version und Changelog prüfen
        run: python3 scripts/release.py check --tag "${GITHUB_REF_NAME}"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Abhängigkeiten installieren
        run: uv sync --frozen --extra worker --extra test

      - name: Tests
        run: uv run --extra worker --extra test --with pytest pytest tests -q

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend bauen
        working-directory: frontend
        run: |
          npm ci
          npm run build

  release:
    name: GitHub-Release erstellen
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Release-Notizen aus dem Changelog
        run: python3 scripts/release.py notes --version "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: GitHub-Release erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
